[project]
name = "umbral"
version = "0.1.0"
description = "Personal housing radar"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.138,<1",
    "python-multipart>=0.0,<1",
    "uvicorn[standard]>=0.51,<1",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.14,<3",
    "sqlalchemy>=2.0.51,<2.1",
    "alembic>=1.18,<2",
    "psycopg[binary]>=3.3.4,<4",
    "geoalchemy2>=0.20,<0.21",
    "pgvector>=0.5,<1",
    "rq>=2.10,<3",
    "redis[hiredis]>=8,<9",
    "boto3>=1.43,<2",
    "opentelemetry-api>=1,<2",
    "opentelemetry-sdk>=1,<2",
    "opentelemetry-exporter-otlp-proto-http>=1,<2",
    "sentry-sdk[fastapi]>=2,<3",
    "supabase>=2,<3",
    "resend>=2,<3",
    "langgraph>=1.2.10",
    "langgraph-checkpoint-postgres>=3.1.2",
    "jsonschema>=4,<5",
]

[project.optional-dependencies]
# osmium carries a native build (needs libbz2-dev/libexpat1-dev/zlib1g-dev on
# CI and in Docker); it is only required by the OSM snapshot import command, so
# it ships as an optional extra and is installed in the runtime image but not in
# CI checks. The importer imports it lazily and reports a clear error when absent.
urban = [
    "osmium>=3.6,<4",
]
scraping = [
    "playwright>=1.50,<2",
]

[dependency-groups]
pytest = [
    "pytest>=8,<9",
    "pytest-asyncio>=1,<2",
    "pytest-cov>=6,<7",
    "testcontainers[postgres,redis]>=4,<5",
    "httpx>=0.28,<1",
    "coverage[toml]>=7,<8",
]
ruff = [
    "ruff>=0.9,<1",
]
mypy = [
    "mypy>=1.14,<2",
    "import-linter>=2,<3",
    "boto3-stubs[s3]>=1.43,<2",
    "types-redis>=4.6,<5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "identity: private-beta identity behavior and contract checks",
    "integration: tests that require external runtime services",
    "e2e: browser-level end-to-end scenarios",
]

[tool.ruff]
target-version = "py313"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
files = ["src", "tests"]
strict = true

[tool.importlinter]
root_package = "umbral"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Runtime layers"
type = "layers"
containers = ["umbral"]
layers = [
    "agent : api : workers",
    "infrastructure",
    "application",
    "domain",
]
ignore_imports = [
    "umbral.infrastructure.agent.production -> umbral.agent.**",
    "umbral.infrastructure.agent.composition -> umbral.agent.**",
]

[[tool.importlinter.contracts]]
name = "Domain boundary"
type = "forbidden"
source_modules = ["umbral.domain"]
forbidden_modules = [
    "umbral.application",
    "umbral.agent",
    "umbral.api",
    "umbral.infrastructure",
    "umbral.workers",
    "fastapi",
    "pydantic",
    "pydantic_settings",
    "sqlalchemy",
    "alembic",
    "psycopg",
    "geoalchemy2",
    "pgvector",
    "rq",
    "redis",
    "boto3",
    "opentelemetry",
    "sentry_sdk",
]

[[tool.importlinter.contracts]]
name = "Identity domain boundary"
type = "forbidden"
source_modules = ["umbral.domain.identity"]
forbidden_modules = [
    "umbral.application",
    "umbral.agent",
    "umbral.api",
    "umbral.infrastructure",
    "umbral.workers",
    "fastapi",
    "pydantic",
    "pydantic_settings",
    "sqlalchemy",
    "alembic",
    "psycopg",
    "geoalchemy2",
    "pgvector",
    "rq",
    "redis",
    "boto3",
    "opentelemetry",
    "sentry_sdk",
]

[[tool.importlinter.contracts]]
name = "Application boundary"
type = "forbidden"
source_modules = ["umbral.application"]
forbidden_modules = [
    "umbral.agent",
    "umbral.api",
    "umbral.infrastructure",
    "umbral.workers",
    "fastapi",
    "pydantic",
    "pydantic_settings",
    "sqlalchemy",
    "alembic",
    "psycopg",
    "geoalchemy2",
    "pgvector",
    "rq",
    "redis",
    "boto3",
    "opentelemetry",
    "sentry_sdk",
]

[[tool.importlinter.contracts]]
name = "Identity application boundary"
type = "forbidden"
source_modules = ["umbral.application.identity"]
forbidden_modules = [
    "umbral.agent",
    "umbral.api",
    "umbral.infrastructure",
    "umbral.workers",
    "fastapi",
    "pydantic",
    "pydantic_settings",
    "sqlalchemy",
    "alembic",
    "psycopg",
    "geoalchemy2",
    "pgvector",
    "rq",
    "redis",
    "boto3",
    "opentelemetry",
    "sentry_sdk",
]

[[tool.importlinter.contracts]]
name = "Agent boundary"
type = "forbidden"
source_modules = ["umbral.agent"]
forbidden_modules = [
    "umbral.api",
    "umbral.infrastructure",
    "umbral.workers",
    "fastapi",
    "pydantic",
    "pydantic_settings",
    "sqlalchemy",
    "alembic",
    "psycopg",
    "geoalchemy2",
    "pgvector",
    "rq",
    "redis",
    "boto3",
]

[[tool.importlinter.contracts]]
name = "API boundary"
type = "forbidden"
source_modules = ["umbral.api"]
forbidden_modules = [
    "umbral.workers",
]

[[tool.importlinter.contracts]]
name = "Workers boundary"
type = "forbidden"
source_modules = ["umbral.workers"]
forbidden_modules = [
    "umbral.agent",
    "umbral.api",
]

[[tool.importlinter.contracts]]
name = "Infrastructure boundary"
type = "forbidden"
source_modules = ["umbral.infrastructure"]
forbidden_modules = [
    "umbral.agent",
    "umbral.api",
    "umbral.workers",
]
ignore_imports = [
    "umbral.infrastructure.agent.production -> umbral.agent.**",
    "umbral.infrastructure.agent.composition -> umbral.agent.**",
]
