name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8.6.4-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.17"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: npm
      - name: Ensure npm 12 (web harness requires >=12,<13)
        run: npm install -g npm@12
      - run: uv sync --frozen --all-groups
      - run: npm ci
      - name: Bridge venv bin to Scripts for the Windows-style harness
        shell: bash
        run: |
          mkdir -p .venv/Scripts
          for f in .venv/bin/*; do
            [ -x "$f" ] || continue
            name="$(basename "$f")"
            ln -sf "../bin/$name" ".venv/Scripts/$name.exe"
          done
      - name: Identity and provider tests
        env:
          PYTHONPATH: src
        run: uv run pytest tests/unit/identity tests/integration/identity tests/contract/test_identity_provider.py tests/contract/test_email_provider.py
      - run: npm run test:identity --workspace @umbral/web
      - run: ./scripts/check.ps1
        shell: pwsh
