name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - name: Require classic GHCR deploy token
        env:
          GHCR_DEPLOY_TOKEN: ${{ secrets.GHCR_DEPLOY_TOKEN }}
        run: |
          if [ -z "$GHCR_DEPLOY_TOKEN" ]; then
            echo "GHCR_DEPLOY_TOKEN (classic PAT with write:packages) is required so Railway can pull public packages anonymously." >&2
            exit 1
          fi
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_DEPLOY_TOKEN }}
      - id: runtime
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.runtime
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}/runtime:${{ github.sha }}
          provenance: mode=max
      - id: web
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}/web:${{ github.sha }}
          provenance: mode=max
      - name: Ensure GHCR packages are public for anonymous Railway pulls
        env:
          GH_TOKEN: ${{ secrets.GHCR_DEPLOY_TOKEN }}
          PACKAGE_PREFIX: ${{ github.event.repository.name }}
        run: |
          owner_type="$(gh api "/users/${{ github.repository_owner }}" --jq .type)"
          if [ "$owner_type" = "Organization" ]; then
            owner_endpoint="/orgs/${{ github.repository_owner }}"
          else
            owner_endpoint="/user"
          fi
          for image in runtime web; do
            package="${PACKAGE_PREFIX}%2F${image}"
            visibility="$(gh api "${owner_endpoint}/packages/container/${package}" --jq .visibility)"
            if [ "$visibility" != "public" ]; then
              echo "::error::GHCR package ${PACKAGE_PREFIX}/${image} is '${visibility}', but Railway pulls it anonymously and needs it public. Set it to public once in the GitHub web UI: https://github.com/users/${{ github.repository_owner }}/packages/container/package/${package}/settings"
              exit 1
            fi
          done
      - name: Record immutable release identity
        shell: pwsh
        env:
          WEB_IMAGE: ghcr.io/${{ github.repository }}/web
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
          RUNTIME_IMAGE: ghcr.io/${{ github.repository }}/runtime
          RUNTIME_DIGEST: ${{ steps.runtime.outputs.digest }}
        run: |
          ./scripts/deploy/build-release.ps1 -ReleaseId "${{ github.ref_name }}" -GitSha "${{ github.sha }}" -DatabaseRevision "0019_feedback_strength_confidence" -WebImage $env:WEB_IMAGE -WebDigest $env:WEB_DIGEST -RuntimeImage $env:RUNTIME_IMAGE -RuntimeDigest $env:RUNTIME_DIGEST
          New-Item -ItemType Directory -Force -Path artifacts/provenance | Out-Null
          docker buildx imagetools inspect "${env:WEB_IMAGE}@${env:WEB_DIGEST}" --raw | Set-Content -NoNewline -Encoding utf8 artifacts/provenance/web.json
          docker buildx imagetools inspect "${env:RUNTIME_IMAGE}@${env:RUNTIME_DIGEST}" --raw | Set-Content -NoNewline -Encoding utf8 artifacts/provenance/runtime.json
      - name: Publish immutable release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest-${{ github.sha }}
          path: |
            artifacts/release-manifest.json
            artifacts/release-manifest.json.sha256
            artifacts/provenance/
